<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <footer th:fragment="footer">
        <div class="container py-5">
            <div class="row g-4">

                <!-- logo y descripción -->
                <div class="col-lg-4 col-md-6">
                    <a th:href="@{/}" class="d-flex align-items-center text-decoration-none mb-3">
                        <img th:src="@{/img/riffy_logo.png}" alt="Logo Riffy" id="logoRiffy">
                        <span class="fw-bold fs-4 footer-logo-nombre">Riffy</span>
                    </a>
                    <p class="footer-descripcion">
                        El marketplace para coleccionistas de vinilos y CDs. Compra, vende y descubre música física de forma segura.
                    </p>
                    <div class="d-flex gap-3 mt-3">
                        <a href="https://www.instagram.com/riffy_officiall/" class="footer-social">
                            <i class="fab fa-instagram fa-lg"></i>
                        </a>
                        <a href="https://x.com/riffy_oficial" class="footer-social">
                            <i class="fab fa-twitter fa-lg"></i>
                        </a>
                    </div>
                </div>

                <!-- enlaces -->
                <div class="col-lg-2 col-md-6 col-6">
                    <h6 class="footer-titulo">Riffy</h6>
                    <ul class="list-unstyled d-flex flex-column gap-2">
                        <li><a th:href="@{/}" class="footer-link">Inicio</a></li>
                        <li><a th:href="@{/#seccion-nosotros}" class="footer-link">Nosotros</a></li>
                        <li><a th:href="@{/#seccion-servicios}" class="footer-link">Servicios</a></li>
                        <li><a th:href="@{/#seccion-contacto}" class="footer-link">Contacto</a></li>
                    </ul>
                </div>

                <!-- contacto -->
                <div class="col-lg-4 col-md-6">
                    <h6 class="footer-titulo">Contacto</h6>
                    <ul class="list-unstyled d-flex flex-column gap-2">
                        <li class="footer-contacto-item">
                            <i class="fas fa-envelope me-2 icono-titulo"></i>soporte@riffy.com
                        </li>
                        <li class="footer-contacto-item">
                            <i class="fas fa-clock me-2 icono-titulo"></i>Lun - Vie, 9:00 - 18:00 h
                        </li>
                    </ul>
                </div>

            </div>

            <hr class="footer-divider">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 pt-2">
                <p class="footer-copyright">&copy; 2025 Riffy. Todos los derechos reservados.</p>
            </div>

        </div>
    </footer>
</body>

</html>
