<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Resultados de búsqueda – Riffy</title>

    <!-- favicon -->
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/img/riffy_favicon.ico}">

    <div th:replace="~{fragmentos/sections :: head}"></div>
</head>

<body>

    <div th:replace="~{fragmentos/nav-home :: nav-home}"></div>

    <main class="container-fluid pt-5 mt-4">
        <div class="row g-4 px-4 pt-3 home-main">

            <!-- SIDEBAR FILTROS -->
            <aside class="col-lg-2 col-md-3">
                <div class="card rounded-4 shadow-sm p-3 sticky-top" style="top: 80px;">
                    <h6 class="fw-bold mb-3">
                        <i class="fas fa-sliders-h me-2 icono-titulo"></i>Filtros
                    </h6>
                    <form th:action="@{/buscar}" method="get">
                        <!-- Mantener el texto de búsqueda -->
                        <input type="hidden" name="q" th:value="${q}">

                        <!-- Categoría -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Categoría</label>
                            <select name="categoria" class="form-select form-select-sm rounded-pill">
                                <option value="">Todas</option>
                                <option value="Vinilo" th:selected="${categoria == 'Vinilo'}">Vinilo</option>
                                <option value="CD" th:selected="${categoria == 'CD'}">CD</option>
                            </select>
                        </div>

                        <!-- Estado -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Estado del disco</label>
                            <select name="formato" class="form-select form-select-sm rounded-pill">
                                <option value="">Cualquiera</option>
                                <option value="Nuevo" th:selected="${formato == 'Nuevo'}">Nuevo</option>
                                <option value="Muy Bueno" th:selected="${formato == 'Muy Bueno'}">Muy Bueno</option>
                                <option value="Bueno" th:selected="${formato == 'Bueno'}">Bueno</option>
                                <option value="Usado" th:selected="${formato == 'Usado'}">Usado</option>
                            </select>
                        </div>

                        <!-- Precio -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Precio (€)</label>
                            <div class="d-flex gap-2">
                                <input type="number" name="precioMin" class="form-control form-control-sm rounded-pill"
                                    placeholder="Min" min="0" th:value="${precioMin}">
                                <input type="number" name="precioMax" class="form-control form-control-sm rounded-pill"
                                    placeholder="Max" min="0" th:value="${precioMax}">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm rounded-pill w-100">
                            <i class="fas fa-filter me-1"></i> Aplicar
                        </button>
                        <a th:href="@{/buscar(q=${q})}"
                            class="btn btn-outline-secondary btn-sm rounded-pill w-100 mt-2">
                            <i class="fas fa-times me-1"></i> Limpiar filtros
                        </a>
                    </form>
                </div>
            </aside>

            <!-- RESULTADOS -->
            <section class="col-lg-10 col-md-9">

                <!-- Cabecera resultados -->
                <div class="d-flex align-items-center justify-content-between mb-4 pe-2">
                    <h2 class="fw-bold titulo-seccion mb-0" th:if="${q != null and !q.isBlank()}">
                        <i class="fas fa-search me-2 icono-titulo"></i>
                        Resultados para "<span class="acento" th:text="${q}"></span>"
                    </h2>
                    <h2 class="fw-bold titulo-seccion mb-0" th:if="${q == null or q.isBlank()}">
                        <i class="fas fa-compact-disc me-2 icono-titulo"></i>
                        Todos los productos
                    </h2>
                </div>

                <!-- Sin resultados -->
                <div th:if="${productos.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="fas fa-record-vinyl fa-3x mb-3 opacity-25"></i>
                    <p class="lead">No encontramos nada con esos criterios.</p>
                    <a th:href="@{/explorar}" class="btn btn-primary rounded-pill px-4">Ver todo el catálogo</a>
                </div>

                <!-- Grid de tarjetas (reutiliza tu fragmento) -->
                <div class="productos-carrusel" th:if="${!productos.isEmpty()}">
                    <th:block th:each="producto : ${productos}">
                        <div
                            th:replace="~{fragmentos/sections :: tarjeta-producto(${producto}, ${imagenesMap}, ${usuarioId})}">
                        </div>
                    </th:block>
                </div>

            </section>
        </div>
    </main>

</body>

</html>
