<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riffy · Admin</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

    <!-- jQuery + jTable -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://www.jtable.org/Content/jtable/themes/metro/blue/jtable.min.css" />
    <script src="https://www.jtable.org/Scripts/jtable/jquery.jtable.min.js"></script>

    <style>
        /* /////////////////////////////////////////////////////////////////// */
        /* /////////////////////////////// variables ///////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        :root {
            --color-first:          #0d1b2a;
            --color-second:         #1b3a57;
            --color-accent:         #e63946;
            --color-accent-hover:   #c1121f;
            --color-bg:             #ffffff;
            --color-bg-alt:         #e5e5e5;
            --color-text-primary:   #0d1b2a;
            --color-text-secondary: #1b3a57;
            --color-border:         #d0dde8;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* //////////////////////////////// base //////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--color-bg-alt);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* ////////////////////////////// layout //////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* ////////////////////////////// sidebar /////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .admin-sidebar {
            width: 230px;
            background: var(--color-first);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
        }

        .sidebar-logo {
            padding: 22px 18px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .sidebar-logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .sidebar-logo-text span {
            color: var(--color-accent);
        }

        .sidebar-badge {
            font-size: 10px;
            background: var(--color-accent);
            color: white;
            border-radius: 4px;
            padding: 1px 6px;
            margin-left: 6px;
            font-weight: 600;
            vertical-align: middle;
        }

        .sidebar-nav {
            flex: 1;
            padding: 14px 0;
            overflow-y: auto;
        }

        .nav-section-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.28);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0 18px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13.5px;
            transition: all 0.15s;
            border-left: 2px solid transparent;
            text-decoration: none;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }

        .nav-item.active {
            background: rgba(230, 57, 70, 0.14);
            color: white;
            border-left-color: var(--color-accent);
        }

        .sidebar-footer {
            padding: 16px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .sidebar-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .user-name {
            color: rgba(255, 255, 255, 0.85);
            font-size: 12px;
            font-weight: 500;
        }

        .user-role {
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
        }

        .btn-logout {
            background: transparent;
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.5);
            padding: 5px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-logout:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* /////////////////////////////// main ///////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .admin-main {
            margin-left: 230px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* ////////////////////////////// topbar //////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .admin-topbar {
            background: var(--color-bg);
            border-bottom: 0.5px solid var(--color-border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .topbar-sub {
            font-size: 12px;
            color: var(--color-text-secondary);
            opacity: 0.7;
            margin-top: 1px;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* ///////////////////////////// content //////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .admin-content {
            padding: 24px;
            flex: 1;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* /////////////////////////// secciones //////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .seccion-admin {
            display: none;
        }

        .seccion-admin.activa {
            display: block;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* ///////////////////////////// jtable ///////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .jtable-card {
            background: var(--color-bg);
            border: 0.5px solid var(--color-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .jtable-header {
            padding: 14px 18px;
            border-bottom: 0.5px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .jtable-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        /* Personalización jTable con colores del proyecto */
        .jtable-main-container {
            border: none !important;
            font-family: 'Segoe UI', system-ui, sans-serif !important;
            font-size: 13px !important;
        }

        .jtable-main-container .jtable-title {
            background: var(--color-first) !important;
            color: white !important;
            display: none; /* el título lo ponemos nosotros */
        }

        .jtable-main-container table {
            width: 100% !important;
        }

        .jtable-main-container th {
            background: var(--color-bg-alt) !important;
            color: var(--color-text-secondary) !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.4px !important;
            border-color: var(--color-border) !important;
            padding: 10px 14px !important;
        }

        .jtable-main-container td {
            border-color: var(--color-border) !important;
            padding: 10px 14px !important;
            color: var(--color-text-primary) !important;
            vertical-align: middle !important;
        }

        .jtable-main-container tr:hover td {
            background: rgba(230, 57, 70, 0.03) !important;
        }

        .jtable-main-container .jtable-toolbar {
            background: var(--color-bg) !important;
            border-color: var(--color-border) !important;
            padding: 10px 14px !important;
        }

        .jtable-main-container .jtable-toolbar-item-add-record a {
            background: var(--color-accent) !important;
            border-color: var(--color-accent) !important;
            color: white !important;
            border-radius: 8px !important;
            padding: 5px 12px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
        }

        .jtable-main-container .jtable-toolbar-item-add-record a:hover {
            background: var(--color-accent-hover) !important;
        }

        .jtable-main-container .jtable-pagingbar {
            background: var(--color-bg) !important;
            border-color: var(--color-border) !important;
            padding: 8px 14px !important;
        }

        .jtable-main-container .jtable-page-number,
        .jtable-main-container .jtable-page-number-first,
        .jtable-main-container .jtable-page-number-last,
        .jtable-main-container .jtable-page-number-previous,
        .jtable-main-container .jtable-page-number-next {
            border-color: var(--color-border) !important;
            color: var(--color-text-secondary) !important;
            border-radius: 6px !important;
        }

        .jtable-main-container .jtable-page-number-active {
            background: var(--color-accent) !important;
            border-color: var(--color-accent) !important;
            color: white !important;
        }

        .jtable-main-container .jtable-command-button {
            border-radius: 6px !important;
            border-color: var(--color-border) !important;
        }

        .jtable-main-container .jtable-edit-command-button {
            color: var(--color-second) !important;
        }

        .jtable-main-container .jtable-delete-command-button {
            color: var(--color-accent) !important;
        }

        /* /////////////////////////////////////////////////////////////////// */
        /* ////////////////////////////// badges ///////////////////////////// */
        /* /////////////////////////////////////////////////////////////////// */
        .badge-rol-admin {
            background: rgba(230, 57, 70, 0.1);
            color: var(--color-accent);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-rol-user {
            background: rgba(27, 58, 87, 0.1);
            color: var(--color-second);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-activa {
            background: rgba(21, 128, 61, 0.1);
            color: #15803d;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-cerrada {
            background: rgba(180, 100, 0, 0.1);
            color: #b45309;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-disponible {
            background: rgba(27, 58, 87, 0.1);
            color: var(--color-second);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-vendido {
            background: rgba(21, 128, 61, 0.1);
            color: #15803d;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="admin-layout">

    <!-- /////////////////////////////////////////////////////////////////// -->
    <!-- ////////////////////////////// sidebar ///////////////////////////// -->
    <!-- /////////////////////////////////////////////////////////////////// -->
    <aside class="admin-sidebar">

        <div class="sidebar-logo">
            <a class="sidebar-logo-text" th:href="@{/home}">
                riffy<span>.</span>admin
                <span class="sidebar-badge">ADMIN</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-label">Gestión</div>

            <a class="nav-item active" onclick="mostrarSeccion('usuarios', this)">
                <!-- icono usuario -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.025 10 8 10c-2.025 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                </svg>
                Usuarios
            </a>

            <a class="nav-item" onclick="mostrarSeccion('productos', this)">
                <!-- icono disco -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
                    <path d="M9.5 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                </svg>
                Productos
            </a>

            <a class="nav-item" onclick="mostrarSeccion('conversaciones', this)">
                <!-- icono chat -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M2.678 11.894a1 1 0 0 1 .287.801 10.97 10.97 0 0 1-.398 2c1.395-.323 2.247-.697 2.634-.893a1 1 0 0 1 .71-.074A8.06 8.06 0 0 0 8 14c3.996 0 7-2.807 7-6 0-3.192-3.004-6-7-6S1 4.808 1 8c0 1.468.617 2.83 1.678 3.894zm-.493 3.905a21.682 21.682 0 0 1-.713.129c-.2.032-.352-.176-.273-.362a9.68 9.68 0 0 0 .244-.637l.003-.01c.248-.72.45-1.548.524-2.319C.743 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7-3.582 7-8 7a9.06 9.06 0 0 1-2.347-.306c-.52.263-1.639.742-3.468 1.105z"/>
                </svg>
                Conversaciones
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user-info">
                <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(nombreCompletoUsuario, 0, 1))}">A</div>
                <div>
                    <div class="user-name" th:text="${nombreCompletoUsuario}">Admin</div>
                    <div class="user-role">Administrador</div>
                </div>
            </div>
            <a class="btn-logout" th:href="@{/logout}">Salir</a>
        </div>

    </aside>

    <!-- /////////////////////////////////////////////////////////////////// -->
    <!-- //////////////////////////////// main ////////////////////////////// -->
    <!-- /////////////////////////////////////////////////////////////////// -->
    <main class="admin-main">

        <!-- topbar -->
        <div class="admin-topbar">
            <div>
                <div class="topbar-title" id="topbar-titulo">Usuarios</div>
                <div class="topbar-sub" id="topbar-sub">Gestiona los usuarios de la plataforma</div>
            </div>
        </div>

        <!-- content -->
        <div class="admin-content">

            <!-- //////////////////////////////////////////////////////////// -->
            <!-- ////////////////////////// usuarios //////////////////////// -->
            <!-- //////////////////////////////////////////////////////////// -->
            <div id="seccion-usuarios" class="seccion-admin activa">
                <div class="jtable-card">
                    <div class="jtable-header">
                        <span class="jtable-title">Usuarios registrados</span>
                    </div>
                    <div id="tabla-usuarios"></div>
                </div>
            </div>

            <!-- //////////////////////////////////////////////////////////// -->
            <!-- ///////////////////////// productos //////////////////////// -->
            <!-- //////////////////////////////////////////////////////////// -->
            <div id="seccion-productos" class="seccion-admin">
                <div class="jtable-card">
                    <div class="jtable-header">
                        <span class="jtable-title">Productos publicados</span>
                    </div>
                    <div id="tabla-productos"></div>
                </div>
            </div>

            <!-- //////////////////////////////////////////////////////////// -->
            <!-- ////////////////////// conversaciones ////////////////////// -->
            <!-- //////////////////////////////////////////////////////////// -->
            <div id="seccion-conversaciones" class="seccion-admin">
                <div class="jtable-card">
                    <div class="jtable-header">
                        <span class="jtable-title">Conversaciones entre usuarios</span>
                    </div>
                    <div id="tabla-conversaciones"></div>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /* /////////////////////////////////////////////////////////////////// */
    /* //////////////////////// navegación sidebar /////////////////////// */
    /* /////////////////////////////////////////////////////////////////// */
    const titulosSecciones = {
        usuarios:       ['Usuarios',        'Gestiona los usuarios de la plataforma'],
        productos:      ['Productos',        'Modera los productos publicados'],
        conversaciones: ['Conversaciones',   'Supervisa los hilos entre usuarios']
    };

    function mostrarSeccion(nombre, el) {
        // oculta todas las secciones
        document.querySelectorAll('.seccion-admin').forEach(s => s.classList.remove('activa'));
        // activa la seleccionada
        document.getElementById('seccion-' + nombre).classList.add('activa');
        // actualiza nav
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        // actualiza topbar
        document.getElementById('topbar-titulo').textContent = titulosSecciones[nombre][0];
        document.getElementById('topbar-sub').textContent   = titulosSecciones[nombre][1];
    }

    /* /////////////////////////////////////////////////////////////////// */
    /* /////////////////////////// jTable init /////////////////////////// */
    /* /////////////////////////////////////////////////////////////////// */
    $(document).ready(function () {

        /* ── usuarios ── */
        $('#tabla-usuarios').jtable({
            title: 'Usuarios',
            paging: true,
            pageSize: 10,
            sorting: true,
            defaultSorting: 'idUsuario ASC',
            actions: {
                listAction:   '/admin/api/usuarios',
                deleteAction: '/admin/api/usuarios/{id}'
            },
            fields: {
                idUsuario: {
                    title: 'ID',
                    width: '5%',
                    key: true,
                    list: true,
                    edit: false,
                    create: false
                },
                nombre: {
                    title: 'Nombre',
                    width: '20%'
                },
                usuario: {
                    title: 'Usuario',
                    width: '18%'
                },
                fechaRegistro: {
                    title: 'Registro',
                    width: '14%',
                    list: true,
                    edit: false,
                    create: false
                },
                rol: {
                    title: 'Rol',
                    width: '12%',
                    options: { 'USER': 'USER', 'ADMIN': 'ADMIN' },
                    display: function (data) {
                        var clase = data.record.rol === 'ADMIN' ? 'badge-rol-admin' : 'badge-rol-user';
                        return '<span class="' + clase + '">' + data.record.rol + '</span>';
                    }
                }
            }
        });
        $('#tabla-usuarios').jtable('load');

        /* ── productos ── */
        $('#tabla-productos').jtable({
            title: 'Productos',
            paging: true,
            pageSize: 10,
            sorting: true,
            defaultSorting: 'id_producto ASC',
            actions: {
                listAction:   '/admin/api/productos',
                deleteAction: '/admin/api/productos/{id}'
            },
            fields: {
                id_producto: {
                    title: 'ID',
                    width: '5%',
                    key: true,
                    list: true,
                    edit: false,
                    create: false
                },
                titulo: {
                    title: 'Título',
                    width: '22%'
                },
                artista: {
                    title: 'Artista',
                    width: '16%'
                },
                formato: {
                    title: 'Formato',
                    width: '10%'
                },
                precio: {
                    title: 'Precio',
                    width: '10%',
                    display: function (data) {
                        return '<strong style="color:var(--color-accent)">' + data.record.precio + ' €</strong>';
                    }
                },
                estado: {
                    title: 'Estado',
                    width: '12%',
                    display: function (data) {
                        var e = data.record.estado;
                        var clase = e === 'Disponible' ? 'badge-disponible' : 'badge-vendido';
                        return '<span class="' + clase + '">' + e + '</span>';
                    }
                },
                categoria: {
                    title: 'Categoría',
                    width: '12%'
                }
            }
        });
        $('#tabla-productos').jtable('load');

        /* ── conversaciones ── */
        $('#tabla-conversaciones').jtable({
            title: 'Conversaciones',
            paging: true,
            pageSize: 10,
            sorting: true,
            defaultSorting: 'id_conversacion ASC',
            actions: {
                listAction: '/admin/api/conversaciones'
            },
            fields: {
                id_conversacion: {
                    title: 'ID',
                    width: '5%',
                    key: true,
                    list: true,
                    edit: false,
                    create: false
                },
                'producto.titulo': {
                    title: 'Producto',
                    width: '22%',
                    display: function (data) {
                        return data.record.producto ? data.record.producto.titulo : '-';
                    }
                },
                'comprador.usuario': {
                    title: 'Comprador',
                    width: '16%',
                    display: function (data) {
                        return data.record.comprador ? '@' + data.record.comprador.usuario : '-';
                    }
                },
                'vendedor.usuario': {
                    title: 'Vendedor',
                    width: '16%',
                    display: function (data) {
                        return data.record.vendedor ? '@' + data.record.vendedor.usuario : '-';
                    }
                },
                fechaCreacion: {
                    title: 'Fecha',
                    width: '13%'
                },
                conversacionActiva: {
                    title: 'Estado',
                    width: '12%',
                    display: function (data) {
                        var activa = data.record.conversacionActiva;
                        var clase  = activa ? 'badge-activa' : 'badge-cerrada';
                        var texto  = activa ? 'Activa' : 'Cerrada';
                        return '<span class="' + clase + '">' + texto + '</span>';
                    }
                },
                acciones: {
                    title: 'Acciones',
                    width: '10%',
                    sorting: false,
                    display: function (data) {
                        var id     = data.record.id_conversacion;
                        var activa = data.record.conversacionActiva;
                        var texto  = activa ? 'Cerrar' : 'Reabrir';
                        return '<button onclick="toggleConversacion(' + id + ')" '
                             + 'style="border:0.5px solid var(--color-border);background:transparent;'
                             + 'border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;'
                             + 'color:var(--color-text-secondary);transition:all .15s">'
                             + texto + '</button>';
                    }
                }
            }
        });
        $('#tabla-conversaciones').jtable('load');
    });

    /* /////////////////////////////////////////////////////////////////// */
    /* /////////////////////// toggle conversacion ////////////////////// */
    /* /////////////////////////////////////////////////////////////////// */
    function toggleConversacion(id) {
        $.ajax({
            url:  '/admin/api/conversaciones/' + id + '/estado',
            type: 'PATCH',
            success: function () {
                $('#tabla-conversaciones').jtable('reload');
            },
            error: function () {
                alert('Error al cambiar el estado de la conversación.');
            }
        });
    }
</script>

</body>
</html>
